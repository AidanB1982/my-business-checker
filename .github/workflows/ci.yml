name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    # Public placeholders exercise anonymous auth screens without production access.
    # These must match at build and server-start time; no Supabase service is used.
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_a_real_key
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
